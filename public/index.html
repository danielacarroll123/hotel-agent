<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotel Estrella</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Hotel Estrella</h1>

      <section class="weather" aria-label="Seven day weather in Barcelona">
        <h2 class="weather-title">Barcelona, next seven days</h2>
        <div id="weather-strip" class="weather-strip">
          <p class="weather-loading">Loading the forecast</p>
        </div>
      </section>

      <section class="contact">
        <p class="intro">
          Send us a message and we will answer from our guest policies. If we
          cannot answer from the policies, a member of staff will reply.
        </p>

        <form id="message-form" class="form">
          <label class="field">
            <span>Name</span>
            <input type="text" name="name" id="name" required />
          </label>

          <label class="field">
            <span>Email</span>
            <input type="email" name="email" id="email" required />
          </label>

          <label class="field">
            <span>Please leave your message</span>
            <textarea name="message" id="message" rows="5" required></textarea>
          </label>

          <button type="submit" id="send" class="send">Send</button>
        </form>

        <div id="reply" class="reply" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
